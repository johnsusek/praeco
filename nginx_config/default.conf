# cache github api
proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=github_api_cache:60m max_size=10g
                 inactive=60m use_temp_path=off;

# The api has no auth, so only allow browser requests from this site's own origin.
# Allowed: no Origin, or Origin host equal to Host or X-Forwarded-Host. Everything else (incl. "null") is cross-origin.
map "$http_origin|$http_host|$http_x_forwarded_host" $cross_origin {
  default 1;
  "~^\|" 0;
  "~*^https?://([^/|]+)\|\1\|" 0;
  "~*^https?://([^/|]+)\|[^|]*\|\1$" 0;
}

server {
  listen 8080;
  #rewrite ^/my-path(/.*)$ $1 last;

  location /api {
      if ($cross_origin) { return 403; }
      rewrite ^/api/?(.*)$ /$1 break;
      proxy_pass http://elastalert:3030/;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Methods;
      proxy_hide_header Access-Control-Allow-Headers;
      proxy_hide_header Access-Control-Allow-Credentials;
      proxy_hide_header Access-Control-Expose-Headers;
      proxy_hide_header Access-Control-Max-Age;
  }

  location /api-ws {
      if ($cross_origin) { return 403; }
      rewrite ^/api-ws/?(.*)$ /$1 break;
      proxy_pass http://elastalert:3333/;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
  }

  location /api-app/releases {
      resolver 127.0.0.11;
      set $releases_url https://api.github.com/repos/ServerCentral/praeco/releases;
      proxy_cache github_api_cache;
      proxy_pass $releases_url;
  }

  location / {
      root /var/www/html;
      try_files $uri $uri/ /index.html;
  }
}
